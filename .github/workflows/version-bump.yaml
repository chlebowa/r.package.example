      #     suppressWarnings(readLines("NEWS.md"))[-1L] |>
      #       append(
      #         values = sprintf("# teal.builder %s", Sys.getenv("NEW_VERSION")),
      #         after = 0L
      #       ) |>
      #       writeLines(con = "NEWS.md")

