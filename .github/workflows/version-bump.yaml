---
name: Version Bump

on:
  push:
    branches:
      - testbranch

concurrency:
  group: vbump-${{ github.event.pull_request.numer || github.ref }}
  cancel-in-progress: true

jobs:
  vbump:
    name: Bump package version

    runs-on: ubuntu-latest

    if: |
      !contains(github.event.commits[0].message, '[skip vbump]') ||
        !contains(github.event.head_commit.message, '[skip vbump]')

    container:
      image: docker.io/rocker/tidyverse:latest

    steps:

      - name: Checkout repo 🛎
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.head_ref }}

      - name: Locate package root
        shell: bash
        run: |
          PACKAGE_ROOT=$(dirname $(find . -name DESCRIPTION))
          echo "PACKAGE_ROOT=${PACKAGE_ROOT}" >> GITHUB_ENV
          echo ${{ env.PACKAGE_ROOT }}

      - name: Bump version in DESCRIPTION 📜
        if: |
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: Rscript {0}
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: |
          desc::desc_bump_version("dev", normalize = TRUE)

      - name: Update Date field in DESCRIPTION 📅
        shell: Rscript {0}
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: |
          if (desc::desc_has_fields("Date")) desc::desc_set("Date", Sys.Date())

      - name: Read new package version
        shell: bash
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: |
          NEW_VERSION=$(R --slave --vanilla -e 'as.character(desc::desc_get_version())')
          echo NEW_VERSION=${NEW_VERSION} >> GITHUB_ENV
          echo ${NEW_VERSION}

      - name: Find NEWS.md file
        shell: bash
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: |
          NEWS_FILE=$(find . -name NEWS.md)
          echo "NEWS_FILE=${NEWS_FILE}" >> GITHUB_ENV
          echo "news file: ${env.NEWS_FILE}"

      # - name: Bump version in NEWS.md
      #   if: |
      #     ${{ env.NEWS_FILE }}
      #   shell: Rscript {0}
      #   working-directory: ${{ env.PACKAGE_ROOT }}
      #   env:
      #     NEW_VERSION: ${{ env.NEW_VERSION }}
